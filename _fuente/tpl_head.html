<script>
/* Detección de idioma: solo en la primera visita, respeta la elección guardada y no afecta a buscadores */
(function(){try{
  var ALT={{alt_json}}, cur="{{lang}}", key="el_lang", saved=localStorage.getItem(key);
  if(/bot|crawl|spider|slurp|google|bing|yandex|duckduck|baidu|facebookexternalhit|preview/i.test(navigator.userAgent)) return;
  var want=saved;
  if(!want){var l=((navigator.languages&&navigator.languages[0])||navigator.language||"es").toLowerCase().slice(0,2); want=(l==="en"||l==="pt")?l:"es"; localStorage.setItem(key,want);}
  if(want!==cur && ALT[want] && !sessionStorage.getItem("el_stay")) location.replace(ALT[want]+location.hash);
}catch(e){}})();
</script>
<script type="application/ld+json">{{jsonld}}</script>
